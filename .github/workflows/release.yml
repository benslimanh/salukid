name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build-static:
    name: Static binaries (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev \
            libnghttp2-dev libnghttp3-dev libssl-dev
      - name: Vendor mbedTLS
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -b v3.6.2 \
            https://github.com/Mbed-TLS/mbedtls.git mbedtls
          make -C mbedtls CFLAGS="-O2 -fPIC" lib
      - name: Build static
        run: make static
      - name: Build quic
        run: make quic
      - name: Generate SBOM
        run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            secure_httpd
            secure_httpd_quic
            salukid.spdx
            LICENSE

  image:
    name: Distroless image + cosign + SLSA
    runs-on: ubuntu-latest
    needs: build-static
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
        secrets: { registry-username: ${{ github.actor }}, registry-password: ${{ secrets.GITHUB_TOKEN }} }
