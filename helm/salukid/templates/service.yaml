apiVersion: v1
kind: Service
metadata:
  name: {{ include "salukid.fullname" . }}
  labels: {{- include "salukid.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "salukid.selectorLabels" . | nindent 4 }}
  ports:
  - {name: http,  port: {{ .Values.service.http }},  targetPort: http,  protocol: TCP}
  - {name: https, port: {{ .Values.service.https }}, targetPort: https, protocol: TCP}
  - {name: h3,    port: {{ .Values.service.h3 }},    targetPort: h3,    protocol: UDP}
